<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500">
  <defs>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c7d58"/>
      <stop offset="1" stop-color="#384f37"/>
    </linearGradient>
    <linearGradient id="darkSage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d3f2d"/>
      <stop offset="1" stop-color="#1f2b1f"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8e0a5"/>
      <stop offset="0.33" stop-color="#f0d49a"/>
      <stop offset="0.66" stop-color="#f0a8a8"/>
      <stop offset="1" stop-color="#ffc5c5"/>
    </linearGradient>
    <radialGradient id="riskRadial" cx="0.8" cy="0.2">
      <stop offset="0" stop-color="#a8bda1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a8bda1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="1500" fill="#fafaf7"/>

  <!-- NAV -->
  <rect width="1440" height="72" fill="#fafaf7" fill-opacity="0.9"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e6ece4"/>
  <circle cx="64" cy="36" r="15" fill="url(#sage)"/>
  <text x="64" y="41" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="92" y="42" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#2d3f2d">Stuntor</text>

  <!-- Nav buttons -->
  <rect x="1102" y="22" width="138" height="32" rx="16" fill="#ffffff" stroke="#ccd9c7"/>
  <path d="M1122 38h-8M1119 34l-4 4 4 4" stroke="#384f37" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <text x="1132" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#384f37">Halaman Awal</text>

  <rect x="1248" y="22" width="80" height="32" rx="16" fill="#ffffff" stroke="#ccd9c7"/>
  <text x="1288" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#384f37" text-anchor="middle">Riwayat</text>

  <rect x="1336" y="22" width="86" height="32" rx="16" fill="#2d3f2d"/>
  <text x="1379" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Hitung</text>

  <!-- Result Header -->
  <g transform="translate(120, 120)">
    <rect width="130" height="26" rx="13" fill="#e6ece4"/>
    <circle cx="14" cy="13" r="2.5" fill="#5c7d58"/>
    <text x="24" y="17" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#384f37">HASIL PENILAIAN</text>

    <text x="0" y="90" font-family="Fraunces, Georgia, serif" font-size="48" font-weight="400" fill="#1f2b1f">Penilaian risiko <tspan font-style="italic" font-weight="300" fill="#476244">berhasil</tspan></text>
    <text x="0" y="146" font-family="Fraunces, Georgia, serif" font-size="48" font-weight="300" font-style="italic" fill="#476244">dihitung.</text>
    <text x="0" y="184" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#384f37">Berikut hasil analisis antropometri balita berdasarkan standar WHO dan fuzzy Sugeno.</text>

    <!-- Chips -->
    <g transform="translate(0, 212)">
      <rect width="100" height="28" rx="14" fill="#f4f7f3" stroke="#e6ece4"/>
      <text x="12" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#2d3f2d"><tspan font-weight="600">JK:</tspan> Laki-laki</text>
      <rect x="108" y="0" width="110" height="28" rx="14" fill="#f4f7f3" stroke="#e6ece4"/>
      <text x="120" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#2d3f2d"><tspan font-weight="600">Usia:</tspan> 24 bulan</text>
      <rect x="226" y="0" width="100" height="28" rx="14" fill="#f4f7f3" stroke="#e6ece4"/>
      <text x="238" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#2d3f2d"><tspan font-weight="600">TB:</tspan> 82.5 cm</text>
      <rect x="334" y="0" width="105" height="28" rx="14" fill="#f4f7f3" stroke="#e6ece4"/>
      <text x="346" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#2d3f2d"><tspan font-weight="600">BB:</tspan> 10200 g</text>
      <rect x="447" y="0" width="142" height="28" rx="14" fill="#f4f7f3" stroke="#e6ece4"/>
      <text x="459" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#2d3f2d"><tspan font-weight="600">TB Lahir:</tspan> 49.0 cm</text>
      <rect x="597" y="0" width="130" height="28" rx="14" fill="#f4f7f3" stroke="#e6ece4"/>
      <text x="609" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#2d3f2d"><tspan font-weight="600">MP-ASI:</tspan> 6 bulan</text>
    </g>
  </g>

  <line x1="120" y1="392" x2="1320" y2="392" stroke="#e6ece4"/>

  <!-- RISK HERO CARD -->
  <g transform="translate(120, 420)">
    <rect width="620" height="380" rx="28" fill="url(#darkSage)"/>
    <rect width="620" height="380" rx="28" fill="url(#riskRadial)"/>

    <text x="48" y="56" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#ccd9c7">RISK SCORE · FUZZY SUGENO</text>
    <line x1="320" y1="52" x2="572" y2="52" stroke="#a8bda1" stroke-opacity="0.3"/>

    <text x="48" y="210" font-family="Fraunces, Georgia, serif" font-size="120" font-weight="300" fill="#ffffff">10.0</text>
    <text x="262" y="210" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="400" fill="#a8bda1">/ 100</text>

    <rect x="48" y="240" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="68" cy="260" r="4" fill="#a8e0a5"/>
    <text x="82" y="265" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#c5e0c3">Priority Flag: Normal</text>

    <rect x="48" y="316" width="524" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="48" y="316" width="52" height="6" rx="3" fill="url(#meterGrad)"/>

    <text x="48" y="348" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#a8bda1">0 Normal</text>
    <text x="180" y="348" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#a8bda1">30 Low</text>
    <text x="310" y="348" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#a8bda1">60 Medium</text>
    <text x="450" y="348" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#a8bda1">90 High</text>
    <text x="566" y="348" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500" fill="#a8bda1">100</text>
  </g>

  <!-- Z-SCORE CARDS -->
  <g transform="translate(760, 420)">
    <rect width="560" height="178" rx="20" fill="#ffffff" stroke="#e6ece4"/>
    <text x="28" y="40" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#476244">SAAT LAHIR</text>
    <text x="28" y="62" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#7d9a77">Berdasarkan Panjang Badan Lahir</text>
    <text x="28" y="130" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="400" fill="#1f2b1f">-0.84</text>
    <rect x="440" y="82" width="90" height="26" rx="13" fill="#e6ece4"/>
    <text x="485" y="98" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#384f37" text-anchor="middle">Normal</text>
    <text x="530" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#7d9a77" text-anchor="end">Standar WHO LMS</text>
    <text x="530" y="146" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#7d9a77" text-anchor="end">untuk usia 0 bulan</text>

    <rect x="0" y="202" width="560" height="178" rx="20" fill="#ffffff" stroke="#e6ece4"/>
    <text x="28" y="242" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#476244">SAAT PENGUKURAN</text>
    <text x="28" y="264" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#7d9a77">Berdasarkan TB aktual · usia 24 bulan</text>
    <text x="28" y="332" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="400" fill="#1f2b1f">-0.52</text>
    <rect x="440" y="284" width="90" height="26" rx="13" fill="#e6ece4"/>
    <text x="485" y="300" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#384f37" text-anchor="middle">Normal</text>
    <text x="530" y="332" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#7d9a77" text-anchor="end">Standar WHO LMS</text>
    <text x="530" y="348" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#7d9a77" text-anchor="end">sesuai usia aktual</text>
  </g>

  <!-- MONITORING -->
  <g transform="translate(120, 840)">
    <rect width="1200" height="340" rx="20" fill="#ffffff" stroke="#e6ece4"/>

    <text x="32" y="54" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="500" fill="#1f2b1f">Monitoring Perkembangan</text>
    <text x="1168" y="54" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#476244" text-anchor="end">PERBANDINGAN TEMPORAL</text>
    <line x1="32" y1="76" x2="1168" y2="76" stroke="#e6ece4"/>

    <g transform="translate(32, 100)">
      <rect width="500" height="96" rx="16" fill="#f4f7f3"/>
      <text x="250" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#476244" text-anchor="middle">KONDISI SAAT LAHIR</text>
      <text x="250" y="60" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="500" fill="#5a8a56" text-anchor="middle">Normal</text>
      <text x="250" y="82" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#476244" text-anchor="middle">Z-Score -0.84</text>

      <path d="M540 48h56m-8-8l8 8-8 8" stroke="#7d9a77" stroke-width="1.5" stroke-linecap="round" fill="none"/>

      <rect x="636" y="0" width="500" height="96" rx="16" fill="#f4f7f3"/>
      <text x="886" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#476244" text-anchor="middle">KONDISI SAAT INI</text>
      <text x="886" y="60" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="500" fill="#5a8a56" text-anchor="middle">Normal</text>
      <text x="886" y="82" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#476244" text-anchor="middle">Risk Score 10.0</text>
    </g>

    <g transform="translate(32, 220)">
      <rect width="1136" height="84" rx="14" fill="#ccd9c7" fill-opacity="0.3" stroke="#ccd9c7"/>
      <circle cx="40" cy="42" r="20" fill="#ccd9c7"/>
      <path d="M34 43l4 4 8-8" stroke="#2d3f2d" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="76" y="36" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="500" fill="#1f2b1f">Konsisten Baik</text>
      <text x="76" y="58" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#384f37">Lahir normal, kondisi saat ini tetap baik. Pantau terus perkembangan balita secara berkala.</text>
    </g>
  </g>

  <!-- NOTICE -->
  <g transform="translate(120, 1220)">
    <rect width="1200" height="80" rx="14" fill="#f4f7f3"/>
    <rect width="3" height="80" fill="#5c7d58"/>
    <circle cx="32" cy="40" r="10" fill="none" stroke="#384f37" stroke-width="1.6"/>
    <text x="32" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#384f37" text-anchor="middle">!</text>
    <text x="60" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="600" fill="#1f2b1f">Disclaimer</text>
    <text x="60" y="52" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#384f37">Hasil perhitungan ini merupakan penilaian berdasarkan data yang dimasukkan dan tidak dapat menjadi patokan dalam</text>
    <text x="60" y="70" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#384f37">pengambilan keputusan medis. Disarankan berkonsultasi dengan tenaga kesehatan profesional.</text>
  </g>

  <!-- Actions -->
  <line x1="120" y1="1340" x2="1320" y2="1340" stroke="#e6ece4"/>
  <g transform="translate(560, 1380)">
    <rect width="180" height="48" rx="24" fill="#2d3f2d"/>
    <text x="34" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Hitung Kembali</text>
    <path d="M148 24h12M156 20l4 4-4 4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <rect x="200" y="0" width="220" height="48" rx="24" fill="#ffffff" stroke="#ccd9c7" stroke-width="1.5"/>
    <path d="M224 24h-10M218 20l-4 4 4 4" stroke="#2d3f2d" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="240" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#2d3f2d">Kembali ke Halaman Awal</text>
  </g>
</svg>
